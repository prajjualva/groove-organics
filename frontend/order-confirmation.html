<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Confirmed — Groove Organics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="nav-root"></div>

<section class="section" style="padding-top:160px;" id="main-content" tabindex="-1">
  <div class="container" id="confirmation-content" style="max-width:640px;">
    <p>Loading your order…</p>
  </div>
</section>

<div id="footer-root"></div>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/partials.js"></script>
<script>
async function loadConfirmation() {
  const orderId = new URLSearchParams(window.location.search).get('orderId');
  const wrap = document.getElementById('confirmation-content');
  if (!orderId) {
    wrap.innerHTML = '<div class="empty-state">No order specified.</div>';
    return;
  }

  let order = { order_number: orderId, status: 'placed', payment_status: 'pending', payment_gateway: null, items: [] };
  try {
    const res = await api(`/api/orders/${encodeURIComponent(orderId)}/summary`, { auth: false });
    order = res.order;
  } catch {
    // fall back to the minimal placeholder above if the summary lookup fails
  }

  const isCod = order.payment_gateway === 'cod';
  const codNote = isCod
    ? `<div class="card" style="margin-top:16px;background:var(--sand-100);"><strong>Cash on Delivery</strong> — please keep ${formatRupees(order.total_paise)} ready for the delivery agent.</div>`
    : '';
  const trackingNote = order.tracking_url
    ? `<a class="btn btn--outline" style="margin-top:24px;margin-left:12px;" href="${order.tracking_url}" target="_blank" rel="noopener">Track Package${order.courier_name ? ` (${order.courier_name})` : ''}</a>`
    : '';

  const items = order.items || [];
  // Itemized receipt shown directly on the page — previously what was
  // actually bought/paid only ever appeared inside the separate PDF
  // invoice, never on the confirmation page itself.
  const itemsHtml = items.length
    ? `
      <div class="card confirm-items" style="margin-top:16px;">
        <h3 class="mt-0">What you ordered</h3>
        ${items
          .map(
            (i) => `<div class="flex-between"><span>${i.product_name}${i.variant_label ? ` (${i.variant_label})` : ''} × ${i.quantity}</span><span class="mono">${formatRupees(i.line_total_paise)}</span></div>`
          )
          .join('')}
        <hr style="border:none;border-top:1px solid var(--sand-300);margin:12px 0;" />
        ${order.subtotal_paise != null ? `<div class="flex-between" style="font-size:0.88rem;"><span>Subtotal (before GST)</span><span class="mono">${formatRupees(order.subtotal_paise)}</span></div>` : ''}
        ${
          order.cgst_paise || order.sgst_paise
            ? `<div class="flex-between" style="font-size:0.88rem;"><span>CGST (incl.)</span><span class="mono">${formatRupees(order.cgst_paise || 0)}</span></div>
               <div class="flex-between" style="font-size:0.88rem;"><span>SGST (incl.)</span><span class="mono">${formatRupees(order.sgst_paise || 0)}</span></div>`
            : order.igst_paise
            ? `<div class="flex-between" style="font-size:0.88rem;"><span>IGST (incl.)</span><span class="mono">${formatRupees(order.igst_paise)}</span></div>`
            : order.gst_paise != null
            ? `<div class="flex-between" style="font-size:0.88rem;"><span>GST (incl.)</span><span class="mono">${formatRupees(order.gst_paise)}</span></div>`
            : ''
        }
        ${order.shipping_paise != null ? `<div class="flex-between" style="font-size:0.88rem;"><span>Shipping</span><span class="mono">${order.shipping_paise > 0 ? formatRupees(order.shipping_paise) : 'Free'}</span></div>` : ''}
        ${(() => {
          const couponPart = order.coupon_code
            ? Math.max(0, (order.discount_paise || 0) - (order.loyalty_discount_paise || 0) - (order.referral_discount_paise || 0))
            : 0;
          return couponPart
            ? `<div class="flex-between" style="font-size:0.88rem;"><span>Coupon discount (${order.coupon_code})</span><span class="mono">−${formatRupees(couponPart)}</span></div>`
            : '';
        })()}
        ${order.loyalty_discount_paise ? `<div class="flex-between" style="font-size:0.88rem;"><span>Groove Points redeemed</span><span class="mono">−${formatRupees(order.loyalty_discount_paise)}</span></div>` : ''}
        ${order.referral_discount_paise ? `<div class="flex-between" style="font-size:0.88rem;"><span>Referral discount</span><span class="mono">−${formatRupees(order.referral_discount_paise)}</span></div>` : ''}
        <div class="flex-between" style="font-weight:700;margin-top:6px;"><span>Total</span><span class="mono">${formatRupees(order.total_paise)}</span></div>
      </div>`
    : '';

  wrap.innerHTML = `
    <span class="eyebrow">Thank you</span>
    <h1>Your order is placed.</h1>
    <p style="color:var(--moss-700);">A confirmation has been recorded. You can track its status below, and download your invoice any time.</p>
    <div class="card" style="margin-top:24px;">
      <div class="flex-between"><span>Order #</span><span class="mono">${order.order_number}</span></div>
      <div class="flex-between"><span>Status</span><span class="status-pill status-${order.status}">${order.status}</span></div>
      <div class="flex-between"><span>Payment</span><span class="status-pill status-${order.payment_status === 'paid' ? 'delivered' : 'placed'}">${order.payment_status}</span></div>
    </div>
    ${itemsHtml}
    ${codNote}
    <button class="btn btn--primary" style="margin-top:24px;" onclick="openInvoicePdf('${encodeURIComponent(orderId)}')">Download Invoice (PDF)</button>
    ${trackingNote}
    <a class="btn btn--outline" style="margin-top:24px;margin-left:12px;" href="/shop">Continue Shopping</a>
  `;
}
document.addEventListener('DOMContentLoaded', () => {
  renderSiteChrome('');
  loadConfirmation();
});
</script>
</body>
</html>
