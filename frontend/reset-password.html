<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password — Groove Organics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body style="background:var(--moss-900);">

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="card" style="max-width:420px;width:100%;">
    <h3 class="mt-0" id="reset-heading">Set a new password</h3>
    <p id="reset-intro" style="color:var(--moss-700);font-size:0.9rem;">Choose a new password for your account.</p>

    <form id="reset-form">
      <div class="form-field"><label for="rp-password">New password</label><input id="rp-password" type="password" minlength="6" required /></div>
      <div class="form-field"><label for="rp-password-confirm">Confirm new password</label><input id="rp-password-confirm" type="password" minlength="6" required /></div>
      <button class="btn btn--dark" type="submit" style="width:100%;">Set Password</button>
      <p class="form-error" id="reset-error" style="display:none;"></p>
    </form>

    <div id="reset-success" style="display:none;">
      <p class="form-success">Your password has been updated.</p>
      <a href="/account" class="btn btn--primary" style="width:100%;display:block;text-align:center;">Sign In</a>
    </div>

    <div id="reset-invalid" style="display:none;">
      <p class="form-error">This reset link is invalid, expired, or already used.</p>
      <a href="/account" class="btn btn--outline" style="width:100%;display:block;text-align:center;">Back to Sign In</a>
    </div>

    <p style="margin-top:16px;font-size:0.85rem;"><a href="/" style="text-decoration:underline;">Back to site</a></p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
// Two ways this page gets reached, depending on whether the server has
// real Supabase auth configured:
//
// 1. Real Supabase mode — the emailed link points at Supabase's own verify
//    endpoint, which checks the recovery token and then redirects here with
//    #access_token=...&type=recovery in the URL hash. We complete the
//    reset with one narrow, unauthenticated call straight to Supabase's
//    Auth REST API (PUT .../auth/v1/user) — no bundler or supabase-js SDK
//    needed just for this. Same approach api.js already uses (plain fetch)
//    for the rest of the site's calls.
// 2. Demo mode (no Supabase project connected yet) — the emailed link
//    points back here with ?demo=1&token=..., and completing the reset is
//    a normal call to this app's own /api/auth/reset-password-demo.

const form = document.getElementById('reset-form');
const errorEl = document.getElementById('reset-error');
const successEl = document.getElementById('reset-success');
const invalidEl = document.getElementById('reset-invalid');
const introEl = document.getElementById('reset-intro');

function parseHashParams() {
  const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
  return new URLSearchParams(hash);
}

const hashParams = parseHashParams();
const searchParams = new URLSearchParams(window.location.search);

const supabaseAccessToken = hashParams.get('access_token');
const supabaseRecovery = hashParams.get('type') === 'recovery' && supabaseAccessToken;
const demoToken = searchParams.get('demo') === '1' ? searchParams.get('token') : null;

if (!supabaseRecovery && !demoToken) {
  form.style.display = 'none';
  introEl.style.display = 'none';
  invalidEl.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.style.display = 'none';
  const password = document.getElementById('rp-password').value;
  const confirm = document.getElementById('rp-password-confirm').value;
  if (password.length < 6) {
    errorEl.textContent = 'Password must be at least 6 characters.';
    errorEl.style.display = 'block';
    return;
  }
  if (password !== confirm) {
    errorEl.textContent = "Passwords don't match.";
    errorEl.style.display = 'block';
    return;
  }

  try {
    if (supabaseRecovery) {
      const status = await api('/api/status', { auth: false });
      if (!status.supabaseUrl || !status.supabaseAnonKey) {
        throw new Error('Password reset is not fully configured on the server yet — contact the site owner.');
      }
      const res = await fetch(`${status.supabaseUrl}/auth/v1/user`, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${supabaseAccessToken}`,
          apikey: status.supabaseAnonKey,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.msg || body.error_description || 'Could not update your password — the link may have expired.');
      }
    } else {
      await api('/api/auth/reset-password-demo', {
        method: 'POST',
        auth: false,
        body: { token: demoToken, password },
      });
    }
    form.style.display = 'none';
    introEl.style.display = 'none';
    successEl.style.display = 'block';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
