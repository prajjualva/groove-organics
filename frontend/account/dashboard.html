<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Account — Groove Organics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="nav-root"></div>

<header class="page-header" style="padding:140px 0 40px;" id="main-content" tabindex="-1">
  <div class="container flex-between">
    <div>
      <span class="breadcrumb">My Account</span>
      <h1 style="font-size:1.9rem;margin:0;" id="account-heading">Welcome back</h1>
    </div>
    <button class="btn btn--outline btn--sm" id="logout-btn">Log Out</button>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="dashboard-nav" id="account-tabs">
      <button class="active" data-tab="orders">Orders</button>
      <button data-tab="addresses">Addresses</button>
      <button data-tab="wishlist">Wishlist</button>
      <button data-tab="loyalty">Groove Points</button>
      <button data-tab="referral">Refer & Earn</button>
      <button data-tab="profile">Profile</button>
    </div>
    <div id="account-tab-content"><p>Loading…</p></div>
  </div>
</section>

<div id="footer-root"></div>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/partials.js"></script>
<script src="/js/products-render.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
