<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — Groove Organics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body style="background:var(--moss-900);">

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="card" style="max-width:420px;width:100%;">
    <div class="dashboard-nav" id="auth-tabs">
      <button class="active" data-mode="login">Sign In</button>
      <button data-mode="register">Create Account</button>
    </div>

    <form id="login-form">
      <div class="form-field"><label for="li-email">Email</label><input id="li-email" type="email" required /></div>
      <div class="form-field"><label for="li-password">Password</label><input id="li-password" type="password" required /></div>
      <button class="btn btn--dark" type="submit" style="width:100%;">Sign In</button>
      <p class="form-error" id="login-error" style="display:none;"></p>
      <p style="margin-top:12px;font-size:0.85rem;text-align:right;"><a href="#" id="forgot-password-link" style="text-decoration:underline;">Forgot password?</a></p>
    </form>

    <form id="forgot-password-form" style="display:none;">
      <p style="font-size:0.85rem;color:var(--moss-700);margin-top:0;">Enter your account email and we'll send you a link to reset your password.</p>
      <div class="form-field"><label for="fp-email">Email</label><input id="fp-email" type="email" required /></div>
      <button class="btn btn--dark" type="submit" style="width:100%;">Send Reset Link</button>
      <p class="form-error" id="forgot-password-error" style="display:none;"></p>
      <p class="form-success" id="forgot-password-success" style="display:none;"></p>
      <p style="margin-top:12px;font-size:0.85rem;"><a href="#" id="back-to-login-link" style="text-decoration:underline;">Back to sign in</a></p>
    </form>

    <form id="register-form" style="display:none;">
      <p class="form-success" id="referral-banner" style="display:none;"></p>
      <div class="form-field"><label for="re-name">Full name</label><input id="re-name" required /></div>
      <div class="form-field"><label for="re-email">Email</label><input id="re-email" type="email" required /></div>
      <div class="form-field"><label for="re-password">Password</label><input id="re-password" type="password" minlength="6" required /></div>
      <button class="btn btn--dark" type="submit" style="width:100%;">Create Account</button>
      <p class="form-error" id="register-error" style="display:none;"></p>
    </form>

    <p style="margin-top:16px;font-size:0.85rem;"><a href="/" style="text-decoration:underline;">Back to site</a></p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const tabs = document.getElementById('auth-tabs');
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const forgotPasswordForm = document.getElementById('forgot-password-form');
tabs.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => {
    tabs.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    tabs.style.display = '';
    forgotPasswordForm.style.display = 'none';
    const mode = btn.getAttribute('data-mode');
    loginForm.style.display = mode === 'login' ? 'block' : 'none';
    registerForm.style.display = mode === 'register' ? 'block' : 'none';
  });
});

// Refer-a-friend: a shared link looks like /account?ref=CODE. If present,
// jump straight to the Create Account tab and (once we know whether the
// program's on and what the discount is) show a banner explaining the
// referred signup bonus. The code itself just rides along in the register
// request — the backend resolves and validates it, so an invalid/expired
// code here simply results in no referral link being made, never an error.
const refCode = new URLSearchParams(window.location.search).get('ref');
if (refCode) {
  api('/api/content', { auth: false })
    .then((r) => (r.content && r.content.store_settings) || {})
    .then((settings) => {
      if (!settings.referral_program_enabled) return;
      const banner = document.getElementById('referral-banner');
      const pct = settings.referral_discount_percent;
      banner.textContent = pct ? `You were referred by a friend — sign up to get ${pct}% off your first order!` : "You were referred by a friend — create an account below.";
      banner.style.display = 'block';
    })
    .catch(() => {});
  document.getElementById('auth-tabs').querySelector('[data-mode="register"]').click();
}

document.getElementById('forgot-password-link').addEventListener('click', (e) => {
  e.preventDefault();
  tabs.style.display = 'none';
  loginForm.style.display = 'none';
  registerForm.style.display = 'none';
  forgotPasswordForm.style.display = 'block';
});

document.getElementById('back-to-login-link').addEventListener('click', (e) => {
  e.preventDefault();
  forgotPasswordForm.style.display = 'none';
  tabs.style.display = '';
  tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.getAttribute('data-mode') === 'login'));
  loginForm.style.display = 'block';
});

document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('forgot-password-error');
  const successEl = document.getElementById('forgot-password-success');
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  try {
    const result = await api('/api/auth/forgot-password', {
      method: 'POST',
      auth: false,
      body: { email: document.getElementById('fp-email').value },
    });
    successEl.textContent = result.message || "If an account exists for that email, we've sent a reset link.";
    successEl.style.display = 'block';
    e.target.querySelector('button[type="submit"]').disabled = true;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});

async function afterAuth(token, user) {
  setAuthSession(token, user);
  const redirectTo = new URLSearchParams(window.location.search).get('redirect') || '/account/dashboard';
  window.location.href = redirectTo;
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  try {
    const { token, user } = await api('/api/auth/login', {
      method: 'POST',
      auth: false,
      body: { email: document.getElementById('li-email').value, password: document.getElementById('li-password').value },
    });
    afterAuth(token, user);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('register-error');
  errorEl.style.display = 'none';
  try {
    const result = await api('/api/auth/register', {
      method: 'POST',
      auth: false,
      body: {
        full_name: document.getElementById('re-name').value,
        email: document.getElementById('re-email').value,
        password: document.getElementById('re-password').value,
        referral_code: refCode || undefined,
      },
    });
    if (result.pendingEmailConfirmation) {
      registerForm.innerHTML = `<p class="form-success">${result.message}</p>`;
      return;
    }
    afterAuth(result.token, result.user);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
