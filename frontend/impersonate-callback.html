<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signing in… — Groove Organics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body style="background:var(--moss-900);">

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="card" style="max-width:420px;width:100%;text-align:center;">
    <h3 class="mt-0" id="ic-heading">Signing you in…</h3>
    <p id="ic-intro" style="color:var(--moss-700);font-size:0.9rem;">One moment — this tab is signing in as the customer whose account you opened from the admin panel.</p>

    <div id="ic-error" style="display:none;">
      <p class="form-error" id="ic-error-text">This sign-in link is invalid or has expired.</p>
      <a href="/" class="btn btn--outline" style="width:100%;display:block;text-align:center;">Back to site</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
// Reached from Admin -> Customers -> "Log in as", as
// /impersonate-callback?token=... . The admin API
// (POST /api/customers/:id/impersonate) already did the actual sign-in
// server-side — in demo mode by minting a local session token, in live
// Supabase mode by generating a magic-link OTP and verifying it itself via
// supabase.auth.verifyOtp() — so what lands here is always just a plain
// bearer token, the same shape either way. All this page does is stash it
// and ask the server who it belongs to, exactly like every other page on
// the site authenticates.
//
// (Earlier version of this page expected a Supabase magic-link REDIRECT —
// #access_token=... in the hash — which only works if the exact redirect
// URL is also added to Supabase's Authentication -> URL Configuration ->
// Redirect URLs allowlist. It silently fails otherwise, landing back on
// whatever session was already active in that browser instead — which is
// exactly what was happening. Doing the token exchange server-side, once,
// in the impersonate route avoids needing that allowlist entry at all.)

const headingEl = document.getElementById('ic-heading');
const introEl = document.getElementById('ic-intro');
const errorEl = document.getElementById('ic-error');
const errorTextEl = document.getElementById('ic-error-text');

function showError(message) {
  headingEl.textContent = 'Could not sign in';
  introEl.style.display = 'none';
  errorTextEl.textContent = message || 'This sign-in link is invalid or has expired.';
  errorEl.style.display = 'block';
}

(async () => {
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    showError();
    return;
  }
  try {
    // Stash the token first so api()'s auto-attached Authorization header
    // picks it up for the /api/auth/me call right below.
    setAuthSession(token, {});
    const { user } = await api('/api/auth/me');
    setAuthSession(token, user);
    window.location.replace('/account/dashboard');
  } catch (err) {
    clearAuthSession();
    showError(err.message);
  }
})();
</script>
</body>
</html>
